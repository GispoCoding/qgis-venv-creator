name: Tests and Style check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs, but test every commit on main
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  STABLE_PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint, format and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ env.STABLE_PYTHON_VERSION }}

      - name: Run static analysis (lint)
        run: uv run --locked --only-group lint ruff check

      - name: Run static analysis (format)
        run: uv run --locked --only-group lint ruff format --check

      # The target Python version comes from [tool.ty.environment] in pyproject.toml,
      # so a single run covers all supported versions
      - name: Check types
        run: uv run --locked --no-default-groups --group types ty check src/qgis_venv_creator tests

  unittest:
    name: Python ${{ matrix.python-version }} on ${{ startsWith(matrix.os, 'macos-') && 'macOS' || startsWith(matrix.os, 'windows-') && 'Windows' || 'Linux' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --locked --no-default-groups --group test coverage run -m pytest

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Update version
        run: |
          # --frozen: the lock update would be discarded with the runner anyway
          uv version --bump patch --bump dev --frozen
          python3 scripts/sync_version.py

      - name: Artifact name
        id: artifact-name
        run: echo "name=qgis_venv_creator-build" >> "$GITHUB_OUTPUT"

      - name: Build
        run: uv build

      - name: Upload Artifacts
        id: artifact-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: |
            dist/*
            src/qgis_venv_creator/create_qgis_venv.py
    outputs:
      artifact-name: ${{ steps.artifact-name.outputs.name }}
      artifact-url: ${{ steps.artifact-upload.outputs.artifact-url }}

  e2e-windows:
    name: e2e - Windows (${{ matrix.qgis-package }})
    needs: [build]
    runs-on: windows-latest
    # An uncached QGIS installation takes a while
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Bumping a version both installs the new QGIS version and
        # invalidates the cache for that matrix leg.
        include:
          - qgis-package: qgis-ltr
            qgis-version: "3.44.13"
          - qgis-package: qgis
            qgis-version: "4.2.1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ env.STABLE_PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: "pip"
          python-version: ${{ env.STABLE_PYTHON_VERSION }}

      - name: install pytest
        run: |
          pip install --upgrade pip
          pip install pytest

      - name: Cache QGIS installation
        id: cache-qgis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ matrix.qgis-package }}-${{ matrix.qgis-version }}-${{ runner.os }}
          path: C:\Program Files\QGIS*

      - name: Install QGIS
        if: steps.cache-qgis.outputs.cache-hit != 'true'
        uses: crazy-max/ghaction-chocolatey@dfdcf5bba9c0a16358a21c13a06ec5c89024b3ac # v4.1.0
        with:
          args: install ${{ matrix.qgis-package }} -y --version=${{ matrix.qgis-version }}

      - name: download whl
        id: download-whl
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      - name: Install qgis_venv_creator
        run: pip install --no-index --find-links dist qgis_venv_creator

      - name: Run tests
        run: pytest tests --run-e2e -s
        env:
          QGIS_EXPECTED_VERSION: ${{ matrix.qgis-version }}

  e2e-linux:
    name: e2e - Linux
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install QGIS
        run: |
          sudo apt install -y gnupg software-properties-common
          sudo wget -O /etc/apt/keyrings/qgis-archive-keyring.gpg https://download.qgis.org/downloads/qgis-archive-keyring.gpg
          sudo tee -a /etc/apt/sources.list.d/qgis.sources << EOF
          Types: deb deb-src
          URIs: https://qgis.org/ubuntu-ltr
          Suites: $(lsb_release -cs)
          Architectures: amd64
          Components: main
          Signed-By: /etc/apt/keyrings/qgis-archive-keyring.gpg
          EOF
          sudo apt update
          sudo apt install -y qgis
          ls /usr/bin/qgis*
          ls /usr/lib/python3/dist-packages
          python3 -m site

      - name: download whl
        id: download-whl
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      - run: ls dist

      - name: Install qgis_venv_creator
        run: pip3 install --no-index --find-links dist qgis_venv_creator

      - name: install pytest
        run: |
          pip3 install --upgrade pip
          pip3 install pytest

      - name: Run tests
        run: python3 -m pytest tests --run-e2e

  post-artifact-comment:
    name: Post artifact comment
    needs: [lint, unittest, build, e2e-linux, e2e-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # PRs from forks get a read-only token and can't comment
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Comment to update
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: comment-to-update
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: Build Artifacts

      - name: Post artifact URL as a comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.comment-to-update.outputs.comment-id }}
          edit-mode: replace
          body: |-
            ## Build Artifacts

            Build succeeded!
            You can download the built package [here](${{ needs.build.outputs.artifact-url }}).

            Please note that files only stay for around 90 days!

  clear-artifact-comment-on-failure:
    name: Clear artifact comment
    needs: [lint, unittest, build, e2e-linux, e2e-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      failure()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Comment to update
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: comment-to-update
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: Build Artifacts

      - name: Post artifact URL as a comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        if: steps.comment-to-update.outputs.comment-id != ''
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.comment-to-update.outputs.comment-id }}
          edit-mode: replace
          body: |-
            ## Build Artifacts

            The latest tests or build failed, please check the workflow logs for more information.
