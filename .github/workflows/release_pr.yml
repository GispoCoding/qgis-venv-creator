name: Prepare a Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump"
        required: true
        default: "minor"
        type: choice
        options:
          - major
          - minor
          - patch

permissions: {}

jobs:
  update-version:
    name: Update version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # create-pull-request configures its own credentials for pushing the branch
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # No cache in release workflows, to rule out cache poisoning
          enable-cache: false

      - name: Update the version and changelog
        id: version
        env:
          BUMP: ${{ inputs.version }}
        run: |
          # --no-sync: update pyproject.toml and uv.lock without installing anything
          uv version --bump "$BUMP" --no-sync
          python3 scripts/sync_version.py
          version="$(uv version --short --color never)"
          python3 scripts/changelog.py release "$version"
          {
            echo "Bump the version to $version."
            echo
            echo "## Release notes"
            echo
            python3 scripts/changelog.py notes "$version"
          } > "$RUNNER_TEMP/pr-body.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: release/${{ steps.version.outputs.version }}
          commit-message: "Bump version to ${{ steps.version.outputs.version }}"
          title: "Prepare release ${{ steps.version.outputs.version }}"
          body-path: ${{ runner.temp }}/pr-body.md
          base: main
          labels: release
          assignees: ${{ github.actor }}
