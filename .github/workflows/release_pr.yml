name: Prepare a Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump"
        required: true
        default: "minor"
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  update-version:
    name: Update version and changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Update the version and changelog
        id: version
        run: |
          # --no-sync: update pyproject.toml and uv.lock without installing anything
          uv version --bump ${{ github.event.inputs.version }} --no-sync
          python3 scripts/sync_version.py
          version="$(uv version --short --color never)"
          python3 scripts/changelog.py release "$version"
          {
            echo "Bump the version to $version."
            echo
            echo "## Release notes"
            echo
            python3 scripts/changelog.py notes "$version"
          } > "$RUNNER_TEMP/pr-body.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: EndBug/add-and-commit@v9
        with:
          message: "Bump version to ${{ steps.version.outputs.version }}"
          push: false

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release/${{ steps.version.outputs.version }}
          title: "Prepare release ${{ steps.version.outputs.version }}"
          body-path: ${{ runner.temp }}/pr-body.md
          base: main
          labels: release
          assignees: ${{ github.actor }}
