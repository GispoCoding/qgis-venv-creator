name: Publish

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  # Never cancel a release halfway through publishing
  cancel-in-progress: false

jobs:
  build:
    # Only merged release PRs from this repository, never from forks
    if: >-
      github.event.pull_request.merged == true
      && startsWith(github.head_ref, 'release/')
      && github.event.pull_request.head.repo.full_name == github.repository
    name: Build distribution 📦
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit the PR was merged as; the release tag points to it too
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # No cache in release workflows, to rule out cache poisoning
          enable-cache: false

      - name: Get version info
        id: version
        run: echo "version=$(uv version --short --color never)" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/changelog.py notes "$VERSION" > release-notes.md

      - name: Build distribution
        run: uv build

      - name: upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            dist/*
            src/qgis_venv_creator/create_qgis_venv.py
            release-notes.md

    outputs:
      version: ${{ steps.version.outputs.version }}

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/qgis-venv-creator/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: build

      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create a GitHub release
    # Tag and release only after the package is on PyPI
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: build

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ needs.build.outputs.version }}"
          tag_name: "v${{ needs.build.outputs.version }}"
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          body_path: release-notes.md
          files: |
            dist/*
            src/qgis_venv_creator/create_qgis_venv.py
