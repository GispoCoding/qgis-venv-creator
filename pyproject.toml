[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[project]
name = "qgis-venv-creator"
version = "0.1.0"
description = 'Tool to create a virtual python environment for QGIS plugin development'
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = []
authors = [{ name = "Gispo Ltd.", email = "info@gispo.fi" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/GispoCoding/qgis-venv-creator#readme"
Issues = "https://github.com/GispoCoding/qgis-venv-creator/issues"
Source = "https://github.com/GispoCoding/qgis-venv-creator"

[project.scripts]
create-qgis-venv = "qgis_venv_creator.create_qgis_venv:main"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "types" },
    "prek>=0.4",
]
lint = ["ruff>=0.15"]
test = [
    "coverage[toml]>=6.5",
    "pytest",
]
# ty also needs the test dependencies to type check the tests
types = [
    "ty",
    { include-group = "test" },
]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # missing trailing comma, conflicts with the formatter
  "ISC001", # implicit string concatenation, conflicts with the formatter
  "D1",     # missing docstrings, not required for every module/function
  "D203",   # one blank line before class docstring, conflicts with D211
  "D213",   # multi-line summary on second line, conflicts with D212
  "ANN401", # typing.Any in *args/**kwargs pass-throughs is intentional
  "S603",   # flags every subprocess call, inputs here are trusted lists
]
unfixable = [
  "F401", # unused imports
  "F841", # unused variables
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["INP001", "T201"]
"tests/**/*" = ["ANN", "PLC1901", "PLR2004", "PLR6301", "S", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["qgis_venv_creator"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ty.src]
# scripts/ targets newer Python (tomllib) than the 3.8 baseline
include = ["src/qgis_venv_creator", "tests"]

[tool.ty.environment]
python-version = "3.8"

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
source_pkgs = ["qgis_venv_creator", "tests"]
branch = true
parallel = true

[tool.coverage.paths]
qgis_venv_creator = [
  "src/qgis_venv_creator",
  "*/qgis-venv-creator/src/qgis_venv_creator",
]
tests = ["tests", "*/qgis-venv-creator/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
